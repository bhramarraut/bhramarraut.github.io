name: Build Knowledge Index

on:
  push:
    paths:
      - "knowledge/**"
      - "scripts/build_knowledge_index.py"
      - "scripts/build.mjs"
      - ".github/workflows/build-knowledge-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build knowledge-index.json
        run: node scripts/build_knowledge_index.mjs

      - name: Commit updated index if changed
        run: |
          if git diff --quiet -- knowledge-index.json; then
            echo "No knowledge-index.json changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge-index.json
          git commit -m "chore(knowledge): regenerate knowledge-index.json"
          git push
